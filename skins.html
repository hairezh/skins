<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre de Skins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0712;
    --bg-alt: #120b1e;
    --surface: #17101f;
    --surface-hover: #1f1629;
    --accent: #ab77e9;
    --accent-soft: #c9a0f5;
    --accent-dim: #6f4a9e;
    --accent-glow: rgba(171,119,233,.45);
    --gold: #f0c46a;
    --text: #f3eefb;
    --text-dim: #a294bb;
    --text-faint: #6d6284;
    --border: rgba(171,119,233,.16);
    --border-soft: rgba(171,119,233,.08);
    --radius: 14px;
    --danger: #e97a9a;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    cursor: default;
  }
  ::selection{ background: var(--accent-dim); color:#fff; }

  h1,h2,h3, .display{ font-family:'Outfit', sans-serif; letter-spacing:-0.01em; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  a{ color:inherit; }

  /* ---------- ambientação ---------- */
  #trail-canvas{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:999; mix-blend-mode: screen;
  }

  .ambient{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .glow{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:.35;
  }
  .glow.a{ width:520px; height:520px; background:var(--accent); top:-180px; right:-140px; }
  .glow.b{ width:420px; height:420px; background:#5a3a8f; bottom:-160px; left:-100px; opacity:.3; }

  .ring-texture{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, transparent 0 38px, var(--accent) 39px, transparent 40px);
    background-size: 160px 160px;
    opacity:.035;
  }

  .stars{ position:absolute; inset:0; }
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background: var(--accent-soft);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  /* ---------- layout shell ---------- */
  .shell{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding: 0 28px 80px; }

  header.top{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    background:rgba(10,7,18,.72);
    backdrop-filter: blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; }
  .brand .mark{
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .brand .dim{ color: var(--text-faint); font-weight:500; }

  .top-right{ display:flex; align-items:center; gap:18px; }
  .combo{
    font-size:.85rem; color: var(--gold); letter-spacing:.03em;
    display:flex; align-items:center; gap:6px;
  }
  .combo b{ font-size:1rem; }

  /* hit-circle button (assinatura visual) */
  .hit-btn{
    position:relative; width:46px; height:46px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 55%, var(--accent-dim) 100%);
    border:none; cursor:pointer; color:#1a0f2c; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    font-family:'Outfit', sans-serif; font-size:1rem;
    box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 6px 18px -4px var(--accent-glow);
    transition: transform .15s ease;
  }
  .hit-btn:hover{ transform: scale(1.06); }
  .hit-btn:active{ transform: scale(.92); }
  .hit-btn::before{
    content:''; position:absolute; inset:-10px; border-radius:50%;
    border:2px solid var(--accent-soft); opacity:0;
    animation: approach 2.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  @keyframes approach{
    0%{ transform:scale(1.9); opacity:0; }
    12%{ opacity:.75; }
    75%{ opacity:.2; }
    100%{ transform:scale(1); opacity:0; }
  }
  .hit-btn.big{ width:104px; height:104px; font-size:2rem; }
  .hit-btn.big::before{ inset:-22px; }

  /* ---------- hero ---------- */
  .hero{ padding: 64px 0 34px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:.72rem; letter-spacing:.18em;
    color: var(--accent-soft); text-transform:uppercase; margin-bottom:14px;
  }
  .hero h1{ font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight:800; line-height:1.15; max-width:640px; }
  .hero p{ color: var(--text-dim); margin-top:12px; max-width:520px; font-size:.98rem; }

  .toolbar{
    margin-top:30px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .search{
    flex:1; min-width:220px; position:relative;
  }
  .search input{
    width:100%; background: var(--surface); border:1px solid var(--border);
    color:var(--text); padding:12px 16px 12px 40px; border-radius:10px;
    font-family:'Manrope', sans-serif; font-size:.92rem; outline:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .search input:focus{ border-color: var(--accent); background: var(--surface-hover); }
  .search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; }

  select#sortSel{
    background: var(--surface); border:1px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:10px; font-family:'Manrope',sans-serif; font-size:.9rem;
    outline:none; cursor:pointer;
  }

  .tags-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .chip{
    padding:6px 13px; border-radius:999px; font-size:.78rem; cursor:pointer;
    background: var(--surface); border:1px solid var(--border); color: var(--text-dim);
    transition: all .15s ease; user-select:none;
  }
  .chip:hover{ border-color: var(--accent); color:var(--text); }
  .chip.active{ background: var(--accent-dim); color:#fff; border-color: var(--accent); }

  /* ---------- grid ---------- */
  .grid{
    margin-top:36px; display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
  }

  .card{
    background: var(--surface); border:1px solid var(--border-soft); border-radius: var(--radius);
    overflow:hidden; position:relative; transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover{ transform: translateY(-3px); border-color: var(--border); }

  .cover{
    height:150px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Outfit',sans-serif; font-weight:800; font-size:2.4rem; color:#fff;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; }

  .card-actions{
    position:absolute; top:8px; right:8px; display:flex; gap:6px;
    opacity:0; transition: opacity .15s ease;
  }
  .card:hover .card-actions{ opacity:1; }
  .icon-btn{
    width:28px; height:28px; border-radius:8px; border:none; cursor:pointer;
    background: rgba(10,7,18,.65); color: var(--text-dim); backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center; transition: color .15s ease, background .15s ease;
  }
  .icon-btn:hover{ color:#fff; background: rgba(10,7,18,.9); }
  .icon-btn.danger:hover{ color: var(--danger); }

  .card-body{ padding:14px 16px 16px; }
  .card-body h3{ font-size:1.02rem; font-weight:700; }
  .card-body .author{ font-family:'JetBrains Mono',monospace; font-size:.74rem; color: var(--text-faint); margin-top:2px; letter-spacing:.02em; }

  .stars-row{ display:flex; gap:2px; margin-top:9px; }
  .stars-row svg{ width:13px; height:13px; }

  .card-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .card-tags span{
    font-size:.68rem; padding:3px 8px; border-radius:6px;
    background: var(--bg-alt); color: var(--accent-soft); border:1px solid var(--border-soft);
  }

  .card-footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:13px;
  }
  .dl-btn{
    font-size:.78rem; font-weight:600; color: var(--accent-soft); text-decoration:none;
    display:flex; align-items:center; gap:5px; padding:6px 0;
  }
  .dl-btn:hover{ color:#fff; }
  .no-link{ color: var(--text-faint); font-size:.75rem; font-style:italic; }

  /* ---------- empty states ---------- */
  .empty{
    text-align:center; padding: 70px 20px; display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .empty p{ color: var(--text-dim); max-width:340px; font-size:.92rem; }
  .empty-filtered{ text-align:center; padding:50px 20px; color: var(--text-faint); font-size:.9rem; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(6,4,10,.72); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    width:100%; max-width:440px; background: var(--bg-alt); border:1px solid var(--border);
    border-radius:16px; padding:26px; max-height:88vh; overflow-y:auto;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  .modal h2{ font-size:1.25rem; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.78rem; color: var(--text-dim); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; background: var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:'Manrope',sans-serif; font-size:.9rem; outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color: var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .rate-picker{ display:flex; gap:6px; }
  .rate-picker svg{ width:22px; height:22px; cursor:pointer; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn{
    padding:10px 18px; border-radius:9px; border:none; cursor:pointer;
    font-family:'Manrope',sans-serif; font-size:.87rem; font-weight:600;
  }
  .btn.ghost{ background:transparent; color: var(--text-dim); }
  .btn.ghost:hover{ color:#fff; }
  .btn.solid{ background: var(--accent); color:#1a0f2c; }
  .btn.solid:hover{ background: var(--accent-soft); }

  footer{
    margin-top:60px; padding-top:20px; border-top:1px solid var(--border-soft);
    display:flex; justify-content:center; gap:22px; font-size:.78rem;
  }
  footer button{
    background:none; border:none; color: var(--text-faint); cursor:pointer; font-family:'Manrope',sans-serif;
  }
  footer button:hover{ color: var(--accent-soft); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--surface); border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:10px; font-size:.85rem; z-index:300;
    opacity:0; pointer-events:none; transition: all .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .hit-btn::before, .stars span{ animation:none !important; }
    #trail-canvas{ display:none; }
  }
  @media (max-width: 640px){
    header.top{ padding:14px 18px; }
    .shell{ padding: 0 18px 60px; }
    .hero{ padding-top:40px; }
  }
</style>
</head>
<body>

<canvas id="trail-canvas"></canvas>
<div class="ambient">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="ring-texture"></div>
  <div class="stars" id="starsField"></div>
</div>

<header class="top">
  <div class="brand"><span class="mark"></span> cofre<span class="dim">·</span>skins</div>
  <div class="top-right">
    <span class="combo mono">x<b id="comboCount">0</b></span>
    <button class="hit-btn" id="openAddHeader" title="Adicionar skin" aria-label="Adicionar skin">+</button>
  </div>
</header>

<div class="shell">
  <section class="hero">
    <div class="eyebrow">biblioteca pessoal</div>
    <h1>Guarde e organize suas skins de osu!</h1>
    <p>Nome, autor, link de download e uma nota pessoal — tudo salvo automaticamente, só seu.</p>

    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por nome, autor ou tag...">
      </div>
      <select id="sortSel">
        <option value="recent">Mais recentes</option>
        <option value="name">Nome (A-Z)</option>
        <option value="rating">Nota</option>
      </select>
    </div>

    <div class="tags-row" id="tagsRow"></div>
  </section>

  <section class="grid" id="grid"></section>
  <div class="empty-filtered" id="emptyFiltered" style="display:none;">Nenhuma skin encontrada com esse filtro.</div>

  <footer>
    <button id="exportBtn">exportar biblioteca</button>
    <button id="importBtn">importar biblioteca</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nova skin</h2>
    <form id="skinForm">
      <div class="field"><label>Nome *</label><input type="text" id="f_name" required></div>
      <div class="field"><label>Autor</label><input type="text" id="f_author"></div>
      <div class="field"><label>Imagem de capa (URL)</label><input type="text" id="f_image" placeholder="https://..."></div>
      <div class="field"><label>Link de download</label><input type="text" id="f_url" placeholder="https://..."></div>
      <div class="field"><label>Tags (separadas por vírgula)</label><input type="text" id="f_tags" placeholder="minimal, cursor grande, dark"></div>
      <div class="field">
        <label>Sua nota</label>
        <div class="rate-picker" id="ratePicker"></div>
        <input type="hidden" id="f_rating" value="0">
      </div>
      <div class="field"><label>Notas</label><textarea id="f_notes" placeholder="observações pessoais..."></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn solid">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "skin-library";
  let skins = [];
  let editingId = null;
  let activeTag = null;

  const $ = (s)=>document.querySelector(s);
  const grid = $("#grid");
  const tagsRow = $("#tagsRow");
  const overlay = $("#overlay");
  const toastEl = $("#toast");

  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(()=>toastEl.classList.remove("show"), 2200);
  }

  function hash(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }

  function placeholderGradient(name){
    const h = hash(name||"skin");
    const angle = h % 360;
    const l1 = 55 + (h % 15);
    const l2 = 22 + (h % 10);
    return `linear-gradient(${angle}deg, hsl(266 70% ${l1}%), hsl(266 55% ${l2}%))`;
  }

  async function loadSkins(){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><p class="mono" style="color:var(--text-faint);">carregando sua coleção...</p></div>`;
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      skins = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      skins = [];
    }
    render();
  }

  async function saveSkins(){
    try{
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(skins), false);
      if(!res){ showToast("Não foi possível salvar agora."); }
    }catch(e){
      showToast("Erro ao salvar.");
    }
  }

  function starSvg(filled){
    return `<svg viewBox="0 0 24 24" fill="${filled ? 'var(--gold)' : 'none'}" stroke="var(--gold)" stroke-width="1.5"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.8 1.4 6.9L12 17.6 5.9 20.8l1.4-6.9-5.1-4.8 6.9-.8L12 2z"/></svg>`;
  }

  function allTags(){
    const set = new Set();
    skins.forEach(s=> (s.tags||[]).forEach(t=>set.add(t)));
    return [...set];
  }

  function renderTagsRow(){
    const tags = allTags();
    if(tags.length===0){ tagsRow.innerHTML=""; return; }
    tagsRow.innerHTML = `<span class="chip ${activeTag===null?'active':''}" data-tag="">todas</span>` +
      tags.map(t=>`<span class="chip ${activeTag===t?'active':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("");
    tagsRow.querySelectorAll(".chip").forEach(c=>{
      c.addEventListener("click", ()=>{
        const t = c.dataset.tag;
        activeTag = t === "" ? null : t;
        render();
      });
    });
  }

  function filteredSkins(){
    const q = $("#searchInput").value.trim().toLowerCase();
    const sort = $("#sortSel").value;
    let list = skins.filter(s=>{
      const matchesQ = !q || [s.name, s.author, ...(s.tags||[])].join(" ").toLowerCase().includes(q);
      const matchesTag = !activeTag || (s.tags||[]).includes(activeTag);
      return matchesQ && matchesTag;
    });
    if(sort==="name") list.sort((a,b)=> (a.name||"").localeCompare(b.name||""));
    else if(sort==="rating") list.sort((a,b)=> (b.rating||0)-(a.rating||0));
    else list.sort((a,b)=> (b.addedAt||0)-(a.addedAt||0));
    return list;
  }

  function render(){
    $("#comboCount").textContent = skins.length;
    renderTagsRow();
    const list = filteredSkins();

    if(skins.length===0){
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          <button class="hit-btn big" id="emptyAddBtn" aria-label="Adicionar primeira skin">${skins.length+1}</button>
          <p>Sua coleção está vazia. Clique no círculo para guardar sua primeira skin.</p>
        </div>`;
      $("#emptyFiltered").style.display = "none";
      document.getElementById("emptyAddBtn").addEventListener("click", ()=>openModal());
      return;
    }

    if(list.length===0){
      grid.innerHTML = "";
      $("#emptyFiltered").style.display = "block";
      return;
    }
    $("#emptyFiltered").style.display = "none";

    grid.innerHTML = list.map(s=>{
      const cover = s.image
        ? `<img src="${escapeHtml(s.image)}" alt="${escapeHtml(s.name)}" onerror="this.parentElement.style.background=this.parentElement.dataset.grad; this.remove();">`
        : "";
      const initial = (s.name||"?").trim().charAt(0).toUpperCase();
      return `
      <article class="card" data-id="${s.id}">
        <div class="cover" data-grad="${placeholderGradient(s.name)}" style="background:${s.image? 'var(--bg-alt)': placeholderGradient(s.name)}">
          ${cover || initial}
          <div class="card-actions">
            <button class="icon-btn edit-btn" title="Editar" aria-label="Editar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon-btn danger del-btn" title="Excluir" aria-label="Excluir">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6h12Z"/></svg>
            </button>
          </div>
        </div>
        <div class="card-body">
          <h3>${escapeHtml(s.name)}</h3>
          ${s.author ? `<div class="author">by ${escapeHtml(s.author)}</div>` : ""}
          <div class="stars-row">${[1,2,3,4,5].map(i=>starSvg(i<=(s.rating||0))).join("")}</div>
          ${(s.tags&&s.tags.length) ? `<div class="card-tags">${s.tags.map(t=>`<span>${escapeHtml(t)}</span>`).join("")}</div>` : ""}
          <div class="card-footer">
            ${s.downloadUrl
              ? `<a class="dl-btn" href="${escapeHtml(s.downloadUrl)}" target="_blank" rel="noopener">baixar <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`
              : `<span class="no-link">sem link</span>`}
          </div>
        </div>
      </article>`;
    }).join("");

    grid.querySelectorAll(".edit-btn").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const id = e.target.closest(".card").dataset.id;
        openModal(skins.find(s=>s.id===id));
      });
    });
    grid.querySelectorAll(".del-btn").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const id = e.target.closest(".card").dataset.id;
        const s = skins.find(x=>x.id===id);
        if(confirm(`Excluir "${s.name}" do cofre?`)){
          skins = skins.filter(x=>x.id!==id);
          saveSkins(); render();
          showToast("Skin removida.");
        }
      });
    });
  }

  /* ---------- modal ---------- */
  let currentRating = 0;
  function buildRatePicker(){
    const el = $("#ratePicker");
    el.innerHTML = [1,2,3,4,5].map(i=>`<span data-v="${i}">${starSvg(i<=currentRating)}</span>`).join("");
    el.querySelectorAll("span").forEach(sp=>{
      sp.addEventListener("click", ()=>{
        currentRating = Number(sp.dataset.v);
        $("#f_rating").value = currentRating;
        buildRatePicker();
      });
    });
  }

  function openModal(skin){
    editingId = skin ? skin.id : null;
    $("#modalTitle").textContent = skin ? "Editar skin" : "Nova skin";
    $("#f_name").value = skin ? skin.name : "";
    $("#f_author").value = skin ? (skin.author||"") : "";
    $("#f_image").value = skin ? (skin.image||"") : "";
    $("#f_url").value = skin ? (skin.downloadUrl||"") : "";
    $("#f_tags").value = skin ? (skin.tags||[]).join(", ") : "";
    $("#f_notes").value = skin ? (skin.notes||"") : "";
    currentRating = skin ? (skin.rating||0) : 0;
    buildRatePicker();
    overlay.classList.add("open");
    setTimeout(()=>$("#f_name").focus(), 50);
  }
  function closeModal(){ overlay.classList.remove("open"); editingId=null; }

  $("#openAddHeader").addEventListener("click", ()=>openModal());
  $("#cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && overlay.classList.contains("open")) closeModal(); });

  $("#skinForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    const name = $("#f_name").value.trim();
    if(!name) return;
    const tags = $("#f_tags").value.split(",").map(t=>t.trim()).filter(Boolean);
    const data = {
      id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      name,
      author: $("#f_author").value.trim(),
      image: $("#f_image").value.trim(),
      downloadUrl: $("#f_url").value.trim(),
      tags,
      rating: Number($("#f_rating").value)||0,
      notes: $("#f_notes").value.trim(),
      addedAt: editingId ? (skins.find(s=>s.id===editingId)?.addedAt || Date.now()) : Date.now()
    };
    if(editingId){
      skins = skins.map(s=> s.id===editingId ? data : s);
      showToast("Skin atualizada.");
    }else{
      skins.push(data);
      showToast("Skin adicionada ao cofre.");
    }
    saveSkins();
    closeModal();
    render();
  });

  $("#searchInput").addEventListener("input", render);
  $("#sortSel").addEventListener("change", render);

  /* ---------- export / import ---------- */
  $("#exportBtn").addEventListener("click", async ()=>{
    const json = JSON.stringify(skins, null, 2);
    try{
      await navigator.clipboard.writeText(json);
      showToast("Biblioteca copiada para a área de transferência.");
    }catch(e){
      prompt("Copie o JSON abaixo:", json);
    }
  });
  $("#importBtn").addEventListener("click", ()=>{
    const raw = prompt("Cole o JSON da biblioteca exportada:");
    if(!raw) return;
    try{
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) throw new Error("formato inválido");
      skins = parsed;
      saveSkins();
      render();
      showToast("Biblioteca importada.");
    }catch(e){
      showToast("JSON inválido — importação cancelada.");
    }
  });

  /* ---------- ambient stars ---------- */
  const starsField = $("#starsField");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduceMotion){
    for(let i=0;i<36;i++){
      const s = document.createElement("span");
      s.style.left = Math.random()*100 + "%";
      s.style.top = Math.random()*100 + "%";
      s.style.animationDelay = (Math.random()*4) + "s";
      s.style.animationDuration = (3+Math.random()*3) + "s";
      starsField.appendChild(s);
    }
  }

  /* ---------- cursor trail (assinatura) ---------- */
  const isTouch = matchMedia("(pointer: coarse)").matches;
  if(!reduceMotion && !isTouch){
    const canvas = $("#trail-canvas");
    const ctx = canvas.getContext("2d");
    function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); addEventListener("resize", resize);

    let points = [];
    addEventListener("mousemove", (e)=>{
      points.push({x:e.clientX, y:e.clientY, t:Date.now()});
      if(points.length>28) points.shift();
    });

    function loop(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const now = Date.now();
      points = points.filter(p=> now-p.t < 500);
      points.forEach((p,i)=>{
        const age = (now-p.t)/500;
        const r = 6*(1-age);
        if(r<=0) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(171,119,233,${0.5*(1-age)})`;
        ctx.shadowColor = "rgba(171,119,233,0.8)";
        ctx.shadowBlur = 10;
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  }else{
    $("#trail-canvas").style.display="none";
  }

  loadSkins();
})();
</script>
</body>
</html>
