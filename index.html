<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skins · osu!mania</title>
<style>
  :root{
    --bg: #0f0a17;
    --surface: #1a1224;
    --accent: #ab77e9;
    --accent-dim: #6f4a9e;
    --text: #f2eefb;
    --text-dim: #9c8fb3;
    --border: rgba(171,119,233,.18);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, sans-serif; padding: 32px 20px 60px;
  }
  .wrap{ max-width: 960px; margin: 0 auto; }

  h1{ font-size:1.6rem; margin:0 0 6px; }
  p.sub{ color:var(--text-dim); margin:0 0 24px; font-size:.92rem; }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  input#search{
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:10px 12px; border-radius:8px; font-size:.9rem;
  }
  .keys-filter{ display:flex; gap:6px; flex-wrap:wrap; }
  .keys-filter button{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 12px; border-radius:8px; cursor:pointer; font-size:.85rem;
  }
  .keys-filter button.active{ background:var(--accent-dim); color:#fff; border-color:var(--accent); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:16px; margin-top:20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card .row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card h3{ margin:0; font-size:1rem; }
  .card .keys{ font-size:.75rem; color:var(--accent); font-weight:600; }
  .card .author{ font-size:.78rem; color:var(--text-dim); margin-top:2px; }
  .card .tags{ font-size:.72rem; color:var(--text-dim); margin-top:8px; }
  .card a.dl{
    display:block; text-align:center; margin-top:12px; padding:9px; border-radius:7px;
    background:var(--accent); color:#1a0f2c; text-decoration:none; font-weight:600; font-size:.85rem;
  }
  .card span.no-link{ display:block; text-align:center; margin-top:12px; color:var(--text-dim); font-size:.8rem; }

  .empty{ color:var(--text-dim); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Skins · osu!mania</h1>
  <p class="sub">Filtre pelo modo de teclas e baixe.</p>

  <div class="controls">
    <input id="search" type="text" placeholder="Buscar por nome ou autor...">
  </div>
  <div class="keys-filter" id="keysFilter"></div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none;">Nenhuma skin encontrada.</p>
</div>

<script>
/* ===================================================================
   EDITE AQUI — sua lista de skins. Copie um bloco, cole antes do "];"
   e preencha. Campos:
     name        - nome da skin
     author      - autor (opcional)
     keys        - número de teclas (4, 5, 7...) ou null
     downloadUrl - link de download (opcional)
     tags        - palavras-chave, opcional, ex: ["dark","minimal"]
   =================================================================== */
const SKINS = [
  { name: "Exemplo — troque por uma skin real", author: "autor", keys: 4, downloadUrl: "https://osu.ppy.sh/", tags: ["minimal"] },
];
/* =================================================================== */

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let activeKeys = null;

function keysList(){ return [...new Set(SKINS.filter(s=>s.keys).map(s=>s.keys))].sort((a,b)=>a-b); }

function renderFilter(){
  const el = document.getElementById("keysFilter");
  const ks = keysList();
  if(!ks.length){ el.innerHTML = ""; return; }
  el.innerHTML = `<button data-k="" class="${activeKeys===null?'active':''}">todos</button>` +
    ks.map(k=>`<button data-k="${k}" class="${activeKeys===k?'active':''}">${k}K</button>`).join("");
  el.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ activeKeys = b.dataset.k===""?null:Number(b.dataset.k); render(); };
  });
}

function render(){
  renderFilter();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = SKINS.filter(s=>{
    const matchesQ = !q || (s.name+" "+(s.author||"")).toLowerCase().includes(q);
    const matchesK = !activeKeys || s.keys===activeKeys;
    return matchesQ && matchesK;
  });

  const grid = document.getElementById("grid");
  document.getElementById("empty").style.display = list.length ? "none" : "block";

  grid.innerHTML = list.map(s=>`
    <div class="card">
      <div class="row">
        <h3>${esc(s.name)}</h3>
        ${s.keys ? `<span class="keys">${s.keys}K</span>` : ""}
      </div>
      ${s.author ? `<div class="author">${esc(s.author)}</div>` : ""}
      ${s.tags && s.tags.length ? `<div class="tags">${s.tags.map(esc).join(" · ")}</div>` : ""}
      ${s.downloadUrl ? `<a class="dl" href="${esc(s.downloadUrl)}" target="_blank" rel="noopener">baixar</a>` : `<span class="no-link">sem link</span>`}
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input", render);
render();
</script>
</body>
</html>
